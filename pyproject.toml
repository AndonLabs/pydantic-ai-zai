[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-zai"
version = "0.1.0"
description = "Z.AI (Zhipu AI) model provider for pydantic-ai"
readme = {text = "Z.AI (Zhipu AI) model provider for pydantic-ai", content-type = "text/plain"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Z.AI" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim[openai]>=1.105.0",
]

[project.urls]
Homepage = "https://github.com/nicepkg/pydantic-ai-zai"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_zai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]
